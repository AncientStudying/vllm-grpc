[project]
name = "vllm-grpc-gen"
version = "0.1.0"
requires-python = ">=3.12"
description = "Generated protobuf/gRPC stubs for the vllm-grpc frontend, proxy, and client"
readme = "README.md"
license = "MIT"
keywords = ["vllm", "grpc", "llm", "inference", "protobuf"]
authors = [{ name = "AncientStudying", email = "bsansom@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "protobuf>=6.33",
    "grpcio>=1.80",
]

[project.urls]
Homepage = "https://github.com/AncientStudying/vllm-grpc"
Repository = "https://github.com/AncientStudying/vllm-grpc"
Issues = "https://github.com/AncientStudying/vllm-grpc/issues"
Changelog = "https://github.com/AncientStudying/vllm-grpc/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "grpcio-tools>=1.80", "protobuf>=6.33"]
build-backend = "hatchling.build"

# Build-time stub generation (FR-007a): the custom hook runs protoc into src/
# before the build, mirroring `make proto`. proto/ is the single source of
# truth (Constitution Principle I); generated stubs stay gitignored.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Include the gitignored generated stubs in BOTH wheel and sdist (SC-013).
[tool.hatch.build]
artifacts = [
    "src/vllm_grpc/v1/*_pb2.py",
    "src/vllm_grpc/v1/*_pb2_grpc.py",
]
# The M4 schema candidates are not part of the published surface (the Makefile
# generates them locally into an isolated namespace); never ship them.
exclude = [
    "src/vllm_grpc/v1/m4_candidates",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_grpc"]

# Force-include the proto sources so the build hook can reproduce the stubs
# when a downstream consumer builds a wheel from the sdist in a clean env.
[tool.hatch.build.targets.sdist.force-include]
"../../proto/vllm_grpc/v1/health.proto" = "proto/vllm_grpc/v1/health.proto"
"../../proto/vllm_grpc/v1/chat.proto" = "proto/vllm_grpc/v1/chat.proto"
"../../proto/vllm_grpc/v1/completions.proto" = "proto/vllm_grpc/v1/completions.proto"
